[package]
name = "silo"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
uuid = { version = "1.11", features = ["v4"] }
dirs = "5.0"
strum = { version = "0.26", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mockall = "0.13"
tempfile = "3.25.0"
