[package]
name = "silo"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
uuid = { version = "1.11", features = ["v4"] }
dirs = "5.0"
strum = { version = "0.26", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
dialoguer = "0.12"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
mockall = "0.13"
tempfile = "3.25.0"

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_docs_in_private_items = "warn"
