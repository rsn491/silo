[package]
name = "silo"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
uuid = { version = "1.11", features = ["v4"] }
dirs = "5.0"
strum = { version = "0.26", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mockall = "0.13"
tempfile = "3.25.0"

[lints.clippy]
# Catch common correctness and style issues beyond the default set.
pedantic = "warn"

# Pedantic lints that are too noisy for this project's style.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Restriction lints: prefer explicit error handling over silent panics.
# Use `.expect("reason")` in non-test code only where a panic is truly
# impossible; tests may suppress these with `#[allow(clippy::unwrap_used)]`.
unwrap_used = "warn"
expect_used = "warn"
