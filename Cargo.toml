[package]
name = "silo"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
publish = false
description = "Isolated workspace manager for parallel agentic development"
repository = "https://github.com/rsn491/silo"
license = "MIT"

[package.metadata.dist]
cargo-dist-version = "0.28.0"
ci = "github"
installers = ["shell"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
uuid = { version = "1.11", features = ["v4"] }
dirs = "5.0"
strum = { version = "0.26", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
dialoguer = "0.12"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
mockall = "0.13"
tempfile = "3.25.0"

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_docs_in_private_items = "warn"
