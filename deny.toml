[advisories]
# Advisory IDs (RUSTSEC-YYYY-NNNN) or yanked crate specs to ignore.
# Add entries here only with an accompanying reason when a vulnerability
# does not apply to this project's usage.
ignore = []

[licenses]
# Explicitly allowed SPDX license identifiers.
# See https://spdx.org/licenses/ for the full list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Skip license checks for workspace members that are not published to crates.io.
ignore = true

[bans]
# Deny duplicate versions of the same crate; use skip entries for known,
# unavoidable duplicates caused by mismatched transitive requirements.
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
skip = [
    # dirs-sys -> redox_users requires thiserror 1.x; ratatui-core -> kasuari requires thiserror 2.x.
    # No upgrade path without replacing dirs or forking ratatui.
    { crate = "thiserror", reason = "dirs-sys/redox_users pins thiserror 1.x; ratatui-core/kasuari requires thiserror 2.x" },
    { crate = "thiserror-impl", reason = "transitive from thiserror major version split" },
    # dirs-sys -> redox_users requires getrandom 0.2.x; uuid and tempfile require getrandom 0.4.x.
    { crate = "getrandom", reason = "dirs-sys/redox_users pins getrandom 0.2.x; uuid and tempfile require 0.4.x" },
    # getrandom 0.4 conditionally depends on both wasip2 (wit-bindgen 0.57) and wasip3 (wit-bindgen 0.51).
    { crate = "wit-bindgen", reason = "getrandom 0.4 pulls in wasip2 (wit-bindgen 0.57) and wasip3 (wit-bindgen 0.51) simultaneously" },
    # dirs-sys requires windows-sys 0.48.x; clap/crossterm/rustix require 0.59.x+.
    # All windows-* sub-crates are duplicated for the same reason.
    { crate = "windows-sys", reason = "dirs-sys requires windows-sys 0.48.x while clap/crossterm/rustix require a newer version" },
    { crate = "windows-targets", reason = "transitive duplicate from windows-sys version split" },
    { crate = "windows_aarch64_gnullvm", reason = "transitive duplicate from windows-sys version split" },
    { crate = "windows_aarch64_msvc", reason = "transitive duplicate from windows-sys version split" },
    { crate = "windows_i686_gnu", reason = "transitive duplicate from windows-sys version split" },
    { crate = "windows_i686_gnullvm", reason = "transitive duplicate from windows-sys version split" },
    { crate = "windows_i686_msvc", reason = "transitive duplicate from windows-sys version split" },
    { crate = "windows_x86_64_gnu", reason = "transitive duplicate from windows-sys version split" },
    { crate = "windows_x86_64_gnullvm", reason = "transitive duplicate from windows-sys version split" },
    { crate = "windows_x86_64_msvc", reason = "transitive duplicate from windows-sys version split" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
